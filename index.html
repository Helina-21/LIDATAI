<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIDATAI | Neural Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--primary)',
              'primary-glow': 'var(--primary-glow)',
              background: 'var(--bg)',
              surface: 'var(--surface)',
              border: 'var(--border)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'scan': 'scan 2s linear infinite',
              'draw': 'dash 2s ease-out forwards',
              'flash': 'flash 3s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              dash: {
                '0%': { strokeDashoffset: '100' },
                '100%': { strokeDashoffset: '0' },
              },
              flash: {
                '0%, 100%': { opacity: '0.3' },
                '50%': { opacity: '1' },
              }
            }
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Fira+Code:wght@400;500&display=swap');
      
      :root {
        /* Default Dark (Cyan Accent) */
        --primary: #06b6d4;
        --primary-glow: rgba(6, 182, 212, 0.5);
        --bg: #000000;
        --surface: #09090b;
        --border: #27272a;
        --text-main: #f4f4f5;
        --text-muted: #71717a;
      }

      html.light {
        --primary: #0891b2;
        --primary-glow: rgba(8, 145, 178, 0.3);
        --bg: #f4f4f5;
        --surface: #ffffff;
        --border: #e4e4e7;
        --text-main: #18181b;
        --text-muted: #71717a;
      }

      /* Accent Overrides */
      html[data-accent="rose"] { --primary: #f43f5e; --primary-glow: rgba(244, 63, 94, 0.5); }
      html[data-accent="amber"] { --primary: #f59e0b; --primary-glow: rgba(245, 158, 11, 0.5); }
      html[data-accent="emerald"] { --primary: #10b981; --primary-glow: rgba(16, 185, 129, 0.5); }
      html[data-accent="violet"] { --primary: #8b5cf6; --primary-glow: rgba(139, 92, 246, 0.5); }

      html, body, #root {
        height: 100%;
        height: 100dvh; 
        margin: 0;
        padding: 0;
        background-color: var(--bg); 
        color: var(--text-main); 
        overflow: hidden; 
        transition: background-color 0.3s ease, color 0.3s ease;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        background: var(--primary);
        color: white;
      }

      /* View Transitions */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.3s;
      }

      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border); 
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
